---
- name: Install Orthanc locally with Docker
  hosts: local
  become: true

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    orthanc_config_dir: /opt/orthanc/config
    orthanc_storage_dir: /opt/orthanc/storage
    orthanc_http_port: 8042
    orthanc_dicom_port: 4242
    orthanc_aet: CAREBOT
    orthanc_image: orthancteam/orthanc:26.6.0
    orthanc_username: "{{ lookup('env', 'ORTHANC_USERNAME') | default('admin', true) }}"
    orthanc_password: "{{ lookup('env', 'ORTHANC_PASSWORD') }}"
    docker_python_packages:
      Debian:
        - python3-docker
      RedHat:
        - python3-docker

  tasks:
    - name: Check Orthanc password was provided
      ansible.builtin.assert:
        that:
          - orthanc_password | length > 0
        fail_msg: "Set ORTHANC_PASSWORD before running this playbook."

    - name: Check OS packages are known
      ansible.builtin.assert:
        that:
          - ansible_os_family in docker_python_packages
        fail_msg: "This playbook supports Debian/Ubuntu and Fedora/RedHat style systems."

    - name: Check whether Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install Docker engine on Debian or Ubuntu if missing
      ansible.builtin.package:
        name: docker.io
        state: present
      when:
        - ansible_os_family == 'Debian'
        - docker_check.rc != 0

    - name: Stop on Fedora/RedHat if Docker is missing
      ansible.builtin.fail:
        msg: "Docker is not installed. Install Docker first, then run this script again."
      when:
        - ansible_os_family == 'RedHat'
        - docker_check.rc != 0

    - name: Install Python Docker package
      ansible.builtin.package:
        name: "{{ docker_python_packages[ansible_os_family] }}"
        state: present

    - name: Check Docker command exists
      ansible.builtin.command: docker --version
      changed_when: false
      check_mode: false

    - name: Make sure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Orthanc folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ orthanc_config_dir }}"
        - "{{ orthanc_storage_dir }}"

    - name: Write basic Orthanc config
      ansible.builtin.copy:
        dest: "{{ orthanc_config_dir }}/orthanc.json"
        owner: root
        group: root
        mode: "0640"
        content: |
          {
            "Name": "Carebot Orthanc",
            "StorageDirectory": "/var/lib/orthanc/db",
            "DicomAet": "{{ orthanc_aet }}",
            "DicomPort": {{ orthanc_dicom_port }},
            "HttpPort": {{ orthanc_http_port }},
            "RemoteAccessAllowed": true,
            "AuthenticationEnabled": true,
            "RegisteredUsers": {
              "{{ orthanc_username }}": "{{ orthanc_password }}"
            }
          }
      register: orthanc_config
      no_log: true

    - name: Pull Orthanc image
      community.docker.docker_image:
        name: "{{ orthanc_image }}"
        source: pull

    - name: Run Orthanc container
      community.docker.docker_container:
        name: orthanc
        image: "{{ orthanc_image }}"
        state: started
        restart_policy: unless-stopped
        recreate: "{{ orthanc_config.changed }}"
        published_ports:
          - "{{ orthanc_http_port }}:8042"
          - "{{ orthanc_dicom_port }}:4242"
        volumes:
          - "{{ orthanc_config_dir }}/orthanc.json:/etc/orthanc/orthanc.json:ro"
          - "{{ orthanc_storage_dir }}:/var/lib/orthanc/db"

    - name: Wait for Orthanc API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ orthanc_http_port }}/system"
        user: "{{ orthanc_username }}"
        password: "{{ orthanc_password }}"
        force_basic_auth: true
        status_code: 200
      register: orthanc_api
      retries: 10
      delay: 3
      until: orthanc_api.status == 200
      when: not ansible_check_mode
      no_log: true
